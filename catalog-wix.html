/fc7459_51bcef75bfca47aebd862592429f0729~mv2.webp"},{id:"hd-trt001-19314",category:"miaki-moduli",name:"М’який ігровий комплекс «Чарівний ліс» із веселковим містком",code:"HD-TRT001-19314",size:"1050×460×300 см",specs:[],description:"Великий комплекс із двома смугастими вежами-деревами з круглими кронами в кольорові цятки, веселковим канатним містком під вивіскою «WELCOME» над сухим басейном і підвісними м’якими грушами. Навколо — веселкові мати, грибочки, арки та круглі сходинки-«цукерки».",badge:null,catalogPage:108,catalogOrder:429,image:"https://static.wixstatic.com/media/fc7459_b024c9a76856484ba4560660b112d977~mv2.webp"},{id:"hd-trt043-19314",category:"miaki-moduli",name:"М’яка ігрова зона з альтанкою та фруктами",code:"HD-TRT043-19314",size:"450×400×230 см",specs:[],description:"Салатовий м’який майданчик у помаранчевому бортику з альтанкою під зеленим дахом (із сітчастими стінками та кульками всередині), сходинками, трикутною стінкою з зачепами та гіркою. На підлозі — м’які фігури вишні, банана, гусениці та кубики з малюнками.",badge:null,catalogPage:108,catalogOrder:430,image:"https://static.wixstatic.com/media/fc7459_f59948e551f14d32a58e20b7c9ef24ca~mv2.webp"},{id:"hd-trt044-19314",category:"miaki-moduli",name:"М’який навчальний комплекс «Будиночок» з літерами й цифрами",code:"HD-TRT044-19314",size:"450×190×155 см",specs:[],description:"Червоний м’який будиночок із «засніженим» дахом і арковими проходами, салатовий пандус із літерами «C B A» та жовті сходинки з цифрами «3 2 1». Навколо — валики, блакитна доріжка та червоно-помаранчевий бортик зі стовпчиками-«сніжками».",badge:null,catalogPage:108,catalogOrder:431,image:"https://static.wixstatic.com/media/fc7459_8a62a84adee347959fe3ffac753b35e3~mv2.webp"},{id:"hd-trt045-19315",category:"miaki-moduli",name:"М’який модуль «Робот» із гірками",code:"HD-TRT045-19315",size:"360×260×220 см",specs:[],description:"М’яка фігура робота з проходом-аркою, двома похилими гірками та декоративними колесами.",badge:null,cata
