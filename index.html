gOrder:151,image:"/catalog/products/hd-qty082-19276.webp"},{id:"hd-qty083-19276",category:"balansyry",name:"Чотиримісний балансир на пружинах «Пташки»",code:"HD-QTY083-19276",size:"300×40×85 см",specs:[],description:"Чотири блакитні сидіння-пташки з жовтими дзьобами на спільній опорі з пружинами.",badge:null,catalogPage:24,catalogOrder:152,image:"/catalog/products/hd-qty083-19276.webp"},{id:"hd-lqs200-20248",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Підводний світ» із черепахою та гойдалками",code:"HD-LQS200-20248",size:"530×450×280 см",specs:[],description:"Червоно-сірий комплекс із сірою черепахою на даху вежі та рибкою на стовпчику, сходами, червоною прямою, сірою спіральною й трубчастою гіркою з виходом у формі риб’ячої пащі. Збоку — каркас із двома гойдалками; поруч показано вид згори.",badge:"Новинка",catalogPage:25,catalogOrder:153,image:"/catalog/products/hd-lqs200-20248.webp"},{id:"hd-rde1989-032",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Підводний світ» із моржем і морським коником",code:"HD-RDE1989-032",size:"720×320×280 см",specs:[],description:"Червоно-сірий комплекс: морж у ковпачку та черепаха на дахах веж, морський коник і сіра пальма на стовпчиках, панелі з рибками й крабом. Має сходи, червону подвійну гірку, трубчасту гірку з виходом-пащею та сіру спіральну гірку; поруч — вид згори.",badge:"Новинка",catalogPage:25,catalogOrder:154,image:"/catalog/products/hd-rde1989-032.webp"},{id:"hd-lqs202-20248",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Підводний світ» із пальмою",code:"HD-LQS202-20248",size:"620×260×280 см",specs:[],description:"Червоно-сірий комплекс із червоною черепахою на даху, сірим морським коником і червоною пальмою на стовпчиках. Має сходи, червону пряму гірку, трубчасту гірку з виходом у формі риб’ячої пащі та сіру спіральну гірку; поруч — вид згори.",badge:"Новинка",catalogPage:25,catalogOrder:155,image:"/catalog/products/hd-lqs202-20248.webp"},{id:"hd-lqs203-20248",category:"ihrovi-maidanchyky",name:"Жовто-фіолетовий ігровий комплекс «Підводний світ» із равликом",code:"HD-LQS203-20248",size:"490×280×280 см",specs:[],description:"Жовто-фіолетовий комплекс із фіолетовою черепахою на даху, жовтою рибкою на стовпчику та панеллю з мушлею. Має жовто-фіолетову трубчасту гірку з виходом-пащею, жовту подвійну гірку й фігуру равлика; поруч — вид згори.",badge:"Новинка",catalogPage:25,catalogOrder:156,image:"/catalog/products/hd-lqs203-20248.webp"},{id:"hd-lqs204-20248",category:"ihrovi-maidanchyky",name:"Рожево-синій ігровий комплекс «Підводний світ» із трубчастою гіркою",code:"HD-LQS204-20248",size:"700×270×310 см",specs:[],description:"Рожево-синій комплекс із рожевим моржем у синьому ковпачку на даху, синім морським коником і рожевою рибкою на стовпчиках. Має сходи, тунель, довгу рожево-синю трубчасту гірку з виходом-пащею, рожеву пряму гірку під аркою-восьминогом і синю спіральну гірку; поруч — вид згори.",badge:"Новинка",catalogPage:26,catalogOrder:157,image:"/catalog/products/hd-lqs204-20248.webp"},{id:"hd-lqs205-20248",category:"ihrovi-maidanchyky",name:"Блакитно-рожевий ігровий комплекс «Підводний світ» з гойдалкою",code:"HD-LQS205-20248",size:"580×370×280 см",specs:[],description:"Блакитно-рожевий комплекс із блакитним моржем у рожевому ковпачку на даху, блакитною рибкою та рожевим морським коником на стовпчиках. Має зелені сходи, трубчасту гірку з виходом-пащею, рожеву подвійну гірку та каркас із гойдалкою; поруч — вид згори.",badge:"Новинка",catalogPage:26,catalogOrder:158,image:"/catalog/products/hd-lqs205-20248.webp"},{id:"hd-lqs206-20248",category:"ihrovi-maidanchyky",name:"Великий синьо-жовтий ігровий комплекс «Підводний світ»",code:"HD-LQS206-20248",size:"1050×270×300 см",specs:[],description:"Довгий синьо-жовтий комплекс із двома вежами: жовтий морж у синьому ковпачку та синя черепаха на дахах, жовті рибка й морський коник на стовпчиках, жовтий равлик-драбинка. Має тунель, сітчастий місток, сходи, дві сині прямі гірки, гірку під аркою-восьминогом і синю спіральну гірку; поруч — вид згори.",badge:"Новинка",catalogPage:26,catalogOrder:159,image:"/catalog/products/hd-lqs206-20248.webp"},{id:"hd-lqs207-20248",category:"ihrovi-maidanchyky",name:"Блакитно-рожевий ігровий комплекс «Підводний світ» із сітчастим містком",code:"HD-LQS207-20248",size:"750×310×310 см",specs:[],description:"Блакитно-рожевий комплекс із блакитним моржем у рожевому ковпачку та рожевою черепахою на дахах, блакитним морським коником і рожевим равликом. Вежі з’єднує сітчастий місток; є блакитна подвійна гірка, трубчаста гірка з виходом-пащею та рожева спіральна гірка; поруч — вид згори.",badge:"Новинка",catalogPage:26,catalogOrder:160,image:"/catalog/products/hd-lqs207-20248.webp"},{id:"hd-lqs208-20248",category:"ihrovi-maidanchyky",name:"Блакитно-рожевий ігровий комплекс «Підводний світ» із трьома гірками",code:"HD-LQS208-20248",size:"560×300×310 см",specs:[],description:"Блакитно-рожевий комплекс із блакитним моржем у рожевому ковпачку на даху, блакитним морським коником на стовпчику та панеллю з крабом. Має сходи, рожеву хвилясту гірку, рожево-блакитну пряму гірку та блакитну спіральну гірку; поруч — вид згори.",badge:"Новинка",catalogPage:26,catalogOrder:161,image:"/catalog/products/hd-lqs208-20248.webp"},{id:"hd-hyy022-20033",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Ксилофон» із сітчастою вежею",code:"HD-HYY022-20033",size:"970×650×500 см",specs:[],description:"Великий синій комплекс зі скатним дахом у вигляді різнокольорового ксилофона та сітчастою вежею під веселковим конічним дахом. Має сходи, сітчастий тунель-перехід, синю спіральну й темні трубчасті гірки та кольорове колесо (видно на виді згори); показано два ракурси.",badge:"Новинка",catalogPage:27,catalogOrder:162,image:"/catalog/products/hd-hyy022-20033.webp"},{id:"hd-lpe030-20164",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Супергерої»",code:"HD-LPE030-20164",size:"710×680×480 см",specs:[],description:"Синьо-помаранчевий комплекс на коричневих стовпах із синім дахом, панеллю-маскою з павутинням, прозорим куполом-віконцем і круглим щитом із зіркою. Має дерев’яні сходи, помаранчеву пряму та синю спіральну гірки, панель із літерами; поруч — вид згори з довгою трубчастою гіркою.",badge:"Новинка",catalogPage:27,catalogOrder:163,image:"/catalog/products/hd-lpe030-20164.webp"},{id:"hd-lpe031-20169",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Лев»",code:"HD-LPE031-20169",size:"700×300×380 см",specs:[],description:"Помаранчевий комплекс із великою панеллю-мордою лева, циферблатом на ній і декоративними панелями із соняшником та деревцями на вершині. Має помаранчеву спіральну гірку, сріблясту пряму гірку, місток і арку з левовим хвостом.",badge:"Новинка",catalogPage:27,catalogOrder:164,image:"/catalog/products/hd-lpe031-20169.webp"},{id:"hd-lpe029-20163",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Замок»",code:"HD-LPE029-20163",size:"740×690×600 см",specs:[],description:"Комплекс у вигляді замку: біла вежа з сірими зубцями, арковими вікнами та червоним прапорцем, прибудова-стіна й сходи. Має бежеві спіральні трубчасті гірки (одна з прозорою ділянкою), відкриту спіральну та пряму гірки; показано три ракурси — спереду, ззаду та згори.",badge:"Новинка",catalogPage:28,catalogOrder:165,image:"/catalog/products/hd-lpe029-20163.webp"},{id:"hd-lhy001-19157",category:"ihrovi-maidanchyky",name:"Ігровий комплекс із двома червоними вежами та жовтими гірками",code:"HD-LHY001-19157",size:"370×460×310 см",specs:["Зона безпеки: 770×860 см","Місткість: 3–15 осіб","Вік: 3–12 років"],description:"Дві вежі під червоними дахами з жовтими панелями, з’єднані містком із білим поруччям. Має дві жовті хвилясті гірки та білу похилу драбину.",badge:null,catalogPage:29,catalogOrder:167,image:"/catalog/products/hd-lhy001-19157.webp"},{id:"hd-lhy002-19157",category:"ihrovi-maidanchyky",name:"Ігровий комплекс із синьою вежею, гойдалками та гойдалкою-лавкою",code:"HD-LHY002-19157",size:"580×360×310 см",specs:["Зона безпеки: 980×760 см","Місткість: 10–20 осіб","Вік: 3–12 років"],description:"Вежа під синім дахом із бежевими панелями, червоною хвилястою гіркою та драбиною. До вежі примикає коричнева рама з двома гойдалками (червоне й жовте сидіння) та жовтою гойдалкою-лавкою на двох.",badge:null,catalogPage:29,catalogOrder:168,image:"/catalog/products/hd-lhy002-19157.webp"},{id:"hd-lhy004-19157",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Три вежі» з двома гойдалковими рамами",code:"HD-LHY004-19157",size:"1120×460×310 см",specs:["Зона безпеки: 1520×860 см","Місткість: 15–3","Вік: 3–12 років"],description:"Три вежі під червоним, жовтим і синім дахами, з’єднані містками з поруччям; червона, жовта та синя хвилясті гірки, драбини. З одного боку — червона рама з гойдалкою та жовтою гойдалкою-конячкою, з іншого — рама з червоною гойдалкою-лавкою.",badge:null,catalogPage:29,catalogOrder:169,image:"/catalog/products/hd-lhy004-19157.webp"},{id:"hd-lhy003-19157",category:"ihrovi-maidanchyky",name:"Ігровий комплекс із двома синіми вежами та гойдалками",code:"HD-LHY003-19157",size:"730×300×310 см",specs:["Зона безпеки: 1130×700 см","Місткість: 5–20 осіб","Вік: 3–12 років"],description:"Дві вежі під синіми дахами з коричневими панелями, з’єднані містком із поруччям. Має дві сині хвилясті гірки, похилу драбину, раму з гойдалкою та жовтою гойдалкою-конячкою і коричневу фігурну стінку.",badge:null,catalogPage:29,catalogOrder:170,image:"/catalog/products/hd-lhy003-19157.webp"},{id:"hd-lhy006-19158",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Різнокольорові дахи» з однією гойдалковою рамою",code:"HD-LHY006-19158",size:"720×590×310 см",specs:["Зона безпеки: 1120×990 см","Місткість: 10–2[5?]","Вік: 3–12 років"],description:"Три вежі під червоним, жовтим і синім дахами, з’єднані містками з поруччям. Має червону та синю хвилясті гірки, драбину та коричневу раму з жовтою гойдалкою-конячкою і звичайною гойдалкою.",badge:null,catalogPage:30,catalogOrder:171,image:"/catalog/products/hd-lhy006-19158.webp"},{id:"h ів"],description:"Компактний комплекс під кількома зеленими дахами-кронами з бежевими панелями, з двома салатовими відкритими гірками та помаранчевою трубчастою гіркою позаду. Має похилу канатну сітку для лазіння, драбини та коричневу раму з двома гойдалками.",badge:null,catalogPage:32,catalogOrder:179,image:"/catalog/products/hd-lhy013-19160.webp"},{id:"hd-lhy014-19160",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Джунглі» із сітчастим містком",code:"HD-LHY014-19160",size:"735×345×310 см",specs:["Зона безпеки: 1135×745 см","Місткість: 10–15 осіб","Вік: 3–12 років"],description:"Дві вежі під темно-зеленими дахами-кронами з бежевими панелями, з’єднані провислим сітчастим містком. Має дві салатові хвилясті гірки, драбину та раму з двома гойдалками.",badge:null,catalogPage:32,catalogOrder:180,image:"/catalog/products/hd-lhy014-19160.webp"},{id:"hd-lhy015-19160",category:"ihrovi-maidanchyky",name:"Великий ігровий комплекс «Джунглі» з вежею-пагодою",code:"HD-LHY015-19160",size:"1230×410×310 см",specs:["Зона безпеки: 1630×710 см","Місткість: 10–1[5?]","Вік: 3–12 років"],description:"Довгий комплекс із двома вежами під зеленими дахами-кронами та вежею під коричневим дахом-пагодою; дві салатові гірки, помаранчева рампа для лазіння та зелено-коричнева трубчаста гірка. Має похилий перехід із сітчастими бортами, раму із салатовою гойдалкою-лавкою з одного боку та раму з двома гойдалками з іншого.",badge:null,catalogPage:32,catalogOrder:181,image:"/catalog/products/hd-lhy015-19160.webp"},{id:"hd-lhy016-19160",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Джунглі» з гойдалкою-лавкою",code:"HD-LHY016-19160",size:"800×510×310 см",specs:["Зона безпеки: 1200×910 см","Місткість: 10–15 осіб","Вік: 3–12 років"],description:"Дві вежі під зеленими дахами-кронами з бежевими панелями, дві зелені хвилясті гірки та дві похилі канатні сітки. З одного боку — рама з двома гойдалками, з іншого — рама із зеленою гойдалкою-лавкою для двох пар дітей.",badge:null,catalogPage:32,cata років"],description:"Містечко з бежевих будиночків під червоними та чорним дахами, з башточкою, віконцями й балконом. Має червоно-бежеву трубчасту, червону спіральну та бежеву хвилясту гірки, сітчасту кулю, сітчастий місток, сходи й панель «хрестики-нулики».",badge:null,catalogPage:45,catalogOrder:205,image:"/catalog/products/hd-hbw003-19129.webp"},{id:"hd-hbw005-19130",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Вілла» з папугою та гвинтовими сходами",code:"HD-HBW005-19130",size:"1310×1050×445 см",specs:["Серія «Вілла»","Зона безпеки: 1710×1450 см","Місткість: 15–45 осіб","Вік: 3–12 років"],description:"Три з’єднані бежеві будиночки під червоним, зеленим і чорним дахами, з башточкою та фігуркою папуги на даху. Має гвинтові сходи, темно-синю спіральну, синьо-бежеву трубчасту та бежеву хвилясту гірки, ґратчасті містки, скеледром і ігрові панелі з лабіринтами.",badge:null,catalogPage:46,catalogOrder:206,image:"/catalog/products/hd-hbw005-19130.webp"},{id:"hd-mmf001-19361",category:"ihrovi-maidanchyky",name:"Дерев’яний комплекс «Два будиночки» з маркізою",code:"HD-MMF001-19361",size:"1020×600×490 см",specs:["Зона безпеки: 1420×1000 см","Місткість: 20–35 осіб","Вік: 3–12 років","Серія «Магічні будинки»"],description:"Два будиночки під чорними дахами зі смугастою маркізою, балконом і фігурками пташок; чотири гірки, сітчастий тунель і сітка для лазіння.",badge:null,catalogPage:47,catalogOrder:207,image:"/catalog/products/hd-mmf001-19361.webp"},{id:"hd-mmf002-19362",category:"ihrovi-maidanchyky",name:"Дерев’яний комплекс «Будиночок і кораблик»",code:"HD-MMF002-19362",size:"850×690×430 см",specs:["Серія «Магічні будинки»","Зона безпеки: 1250×1090 см","Місткість: 15–35 осіб","Вік: 3–12 років"],description:"Дерев’яний будиночок під червоним дахом із зеленою маркізою, до якого прибудовано палубу-кораблик із фігуркою пташки та емблемою якоря. Має скеледром, дерев’яні сходи, помаранчеві хвилясту та трубчасту гірки й червону спіральну гірку.",badge:null,catalogPage:48,catalogOrder:208,image:"/catalog/products/hd-mmf002-19362.webp"},{id:"hd-mtz003-19365",category:"ihrovi-maidanchyky",name:"Дерев’яний парк пригод зі смугою перешкод",code:"HD-MTZ003-19365",size:"2000×1400×450 см",specs:["Зона безпеки: 2400×1800 см","Місткість: 20–45 осіб","Вік: 3–12 років","Серія «Дерев’яні пригоди»"],description:"Велика дерев’яна ігрова зона: центральні вежі-будиночки з бордово-бежевою трубчастою та прямою гірками, сітчастими пандусами й стінкою з шин, оточені смугою перешкод із підвісними містками, тунелем-бочкою та скеледромом. Поруч — рама з гойдалкою-шиною, гірки-трикутники для лазіння, піраміда з колод, гойдалки-балансири та лавки.",badge:null,catalogPage:49,catalogOrder:209,image:"/catalog/products/hd-mtz003-19365.webp"},{id:"hd-mtz004-19366",category:"ihrovi-maidanchyky",name:"Дерев’яне містечко пригод із двома будиночками",code:"HD-MTZ004-19366",size:"1460×710×370 см",specs:["Зона безпеки: 1860×1110 см","Місткість: 20–45 осіб","Вік: 3–12 років","Серія «Дерев’яні пригоди»"],description:"Квадратна дерев’яна смуга пригод на піщаному майданчику з двома будиночками під двосхилими дахами, трикутним скеледромом і зелено-бежевою трубчастою гіркою. Між вежами — підвісні мотузкові містки, сітчастий тунель, тунель-колода, бежева пряма гірка та пеньки-сходинки.",badge:null,catalogPage:50,catalogOrder:210,image:"/catalog/products/hd-mtz004-19366.webp"},{id:"hd-lpe011-19167",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Будиночок на колесах» із трубчастою гіркою",code:"HD-LPE011-19167",size:"580×240×360 см",specs:["Зона безпеки: 980×640 см","Місткість: 10–35 осіб","Вік: 3–12 років"],description:"Червона вежа-будиночок із жовтим дахом, віконцями та чорними «антенами»-стрілками, поставлена між великим чорним колесом-лазанкою із зачепами та малим жовтим колесом. Від вежі відходять прозорий тунель-лаз і червоно-жовта трубчаста гірка, поруч — чорна стійка з червоною аркою.",badge:null,catalogPage:53,catalogOrder:212,image:"/catalog/products/hd-lpe011-19167.webp"},{id:"hd-lpe027-19167",category:"ihrovi-maidanchyky",name:"Лазанка «Жираф» із сіткою",code:"HD-LPE027-19167",size:"240×120×180 см",specs:["Зона безпеки: 640×520 см","Місткість: 10–35 осіб","Вік: 3–12 років"],description:"Жовтий плаский жираф із чорними плямами, під тулубом якого помаранчева платформа. Похила шия жирафа слугує рамою з чорною сіткою для лазіння.",badge:null,catalogPage:53,catalogOrder:213,image:"/catalog/products/hd-lpe027-19167.webp"},{id:"hd-lpe003-19167",category:"ihrovi-maidanchyky",name:"Космічний комплекс «Ракета» з ажурним куполом",code:"HD-LPE003-19167",size:"660×600×520 см",specs:["Зона безпеки: 1060×1000 см","Місткість: 10–35 осіб","Вік: 3–12 років"],description:"Багаторівнева вежа під білим ажурним куполом із синіми панелями з ракетою та планетою, червоними стійками-ракетами й прапорцем-зіркою. Має синю спіральну трубчасту гірку, синю пряму гірку, скеледром, гвинтову лазанку та сходи.",badge:null,catalogPage:53,catalogOrder:214,image:"/catalog/products/hd-lpe003-19167.webp"},{id:"hd-lpe001-19167",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Ракета» з металевою гіркою",code:"HD-LPE001-19167",size:"460×370×300 см",specs:["Зона безпеки: 860×770 см","Місткість: 10–35 осіб","Вік: 3–12 років"],description:"Червоно-біло-синій корпус ракети з червоними «крилами»-дахом і двома бічними міні-ракетами на стійках. Усередині платформа, з якої спускається широка металева гірка; позаду — сітка та поручні для підйому.",badge:null,catalogPage:53,catalogOrder:215,image:"/catalog/products/hd-lpe001-19167.webp"},{id:"hd-lpe020-19168",category:"ihrovi-maidanchyky",name:"Ігрова вежа «Жираф» із металевою гіркою",code:"HD-LPE020-19168",size:"520×320×530 см",specs:["Зона безпеки: 920×720 см","Місткість: 10–35 осіб","Вік: 3–12 років"],description:"Велетенський жовтий жираф із чорними плямами заввишки понад 5 м: у його тулубі — ігрова платформа, з якої спускається металева гірка. Піднятися можна скеледромом на ніжці жирафа або драбиною.",badge:null,catalogPage:54,catalogOrder:219,image:"/catalog/products/hd-lpe020-19168.webp"},{id:"hd-hyl006-19017",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Старий пень» із хатинкою",code:"HD-HYL006-19017",size:"810×430×380 см",specs:["Зона безпеки: 1210×830 см","Місткість: 10–20 осіб","Вік: 3–12 років","Серія «Стародавні племена»"],description:"Вежа у формі велетенського дуплистого пня з корою, віконцями й осіннім листям, з’єднана тунелем-колодою з хатинкою на палях під дахом-корою з жовтими віконцями. Має дві бежеві прямі гірки, сходи з поруччям і третю гірку з іншого боку.",badge:null,catalogPage:55,catalogOrder:222,image:"/catalog/products/hd-hyl006-19017.webp"},{id:"hd-hyl007-19017",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Старий пень» із пальмою",code:"HD-HYL007-19017",size:"1010×570×380 см",specs:["Зона безпеки: 1410×970 см","Місткість: 10–20 осіб","Вік: 3–12 років","Серія «Стародавні племена»"],description:"Вежа-пень із віконцями, грибочками й осіннім листям поєднана з хатинкою на палях, пальмою та темною металевою вежею зі сходами. Має бежеву трубчасту гірку, кілька прямих гірок, скеледром і місток.",badge:null,catalogPage:55,catalogOrder:223,image:"/catalog/products/hd-hyl007-19017.webp"},{id:"hd-hyl008-19018",category:"ihrovi-maidanchyky",name:"Гірка-вежа «Старий пень» із трубчастою гіркою",code:"HD-HYL008-19018",size:"565×380×330 см",specs:["Зона безпеки: 965×780 см","Місткість: 10–20 осіб","Вік: 3–12 років","Серія «Стародавні племена»"],description:"Компактна вежа у формі дуплистого пня з корою, віконцями та осіннім листям. Сходи з поруччям-гілками ведуть нагору, звідки спускаються бежева пряма гірка та бежева трубчаста гірка.",badge:null,catalogPage:56,catalogOrder:224,image:"/catalog/products/hd-hyl008-19018.webp"},{id:"hd-hyl009-19018",category:"ihrovi-maidanchyky",name:"Ігровий комплекс «Пень і будиночок»",code:"HD-HYL009-19018",size:"750×240×330 см",specs:["Зона безпеки: 1150×640 см","Місткість: 10–20 осіб","Вік: 3–12 років","Серія «Стародавні племена»"],description:"Вежа-пень із прямою бежевою гіркою, з’єднана чорним сітчастим тунелем із дерев’яним будиночком під синім дахом із рожевим оздобленням, віконцями та ґанком із поручнями.",badge:null,catalogPage:56,catalogOrder:225,image:"/catalog/products/hd-hyl009-19018.webp"},{id:"hd-hyy015-19025",category:"ihrovi-maidanchyky",name:"Великий музичний комплекс «Оркестр»",code:"HD-HYY015-19025",size:"1730×610×430 см",specs:["Зона безпеки: 2130×1010 см","Місткість: 25–35 осіб","Вік: 3–12 років","Серія «Концерт»"],description:"Довгий музичний комплекс із кількох з’єднаних секцій: фіолетова частина з вежею-шапіто, жовта з помаранчевими стійками-ріжками, червона з трубчастими гірками та вежа з дахом-клавіатурою, зіркою й чорно-білою трубчастою гіркою. Між секціями — сітчасті містки й лази, на панелях — ноти та скрипкові ключі.",badge:null,catalogPage:57,catalogOrder:226,image:"/catalog/products/hd-hyy015-19025.webp"},{id:"hd-hyy016-19026",category:"ihrovi-maidanchyky",name:"Музичний комплекс «Шапіто»",code:"HD-HYY016-19026",size:"940×540×340 см",specs:["Зона безпеки: 1340×940 см","Місткість: 25–35 осіб","Вік: 3–12 років","Серія «Концерт»"],description:"Комплекс зі стійками у формі чорних і жовтих нот: червона секція з червоно-жовтою трубчастою гіркою та сітками для лазіння з’єднана чорним тунелем-лазом із синьою секцією під дахом-шапіто з синьо-жовтою гіркою. Далі — синій сітчастий місток зі скрипковим ключем і червона панель-скеледром.",badge:null,catalogPage:58,catalogOrder:227,image:"/catalog/products/hd-hyy016-19026.webp"},{id:"hd-hyy011-19021",category:"ihrovi-maidanchyky",name:"Музичний майданчик «Гітара й піаніно»",code:"HD-HYY011-19021",size:"430×550×390 см",specs:["Зона безпеки: 930×950 см","Місткість: 25–35 осіб","Вік: 3–12 років","Серія «Концерт»"],description:"Музичний ігровий майданчик: вежа з дахом-клавіатурою та зіркою, чорно-білою трубчастою й закрученою гірками та скеледромом, помаранчева подвійна гітара-лазанка із сітчастою трубою, синя в ’єднані канатними тунелями та прямим сітчастим переходом, і вежа зі шпилями посередині. Дві блакитні трубчасті гірки з прозорими секціями, жовті фігурки-зірки й пташки на верхівках та жовті фігури біля входів.",badge:null,catalogPage:77,catalogOrder:264,image:"/catalog/products/hd-ssw036-19197.webp"},{id:"hd-ssw037-19197",category:"kanatni-kompleksy",name:"Великий канатний комплекс із сітчастими кулями",code:"HD-SSW037-19197",size:"2098×1196×450 см",specs:[],description:"Червоні сітчасті кулі-вежі, з’єднані канатними тунелями, трубчасті гірки та фігурки-зірки на верхівках — найбільший виріб розділу.",badge:null,catalogPage:77,catalogOrder:265,image:"/catalog/products/hd-ssw037-19197.webp"},{id:"hd-ssw038-19198",category:"kanatni-kompleksy",name:"Канатний комплекс з однією сітчастою кулею та червоною гіркою",code:"HD-SSW038-19198",size:"578×534×430 см",specs:[],description:"Сіра сітчаста куля-вежа на ніжках із двома вигнутими канатними тунелями по боках і червоною трубчастою гіркою з прозорою секцією. На верхівці — фігурки пташок, біля входу — жовта фігура.",badge:null,catalogPage:78,catalogOrder:266,image:"/catalog/products/hd-ssw038-19198.webp"},{id:"hd-ssw039-19198",category:"kanatni-kompleksy",name:"Канатний комплекс із двома сітчастими кулями та помаранчевою гіркою",code:"HD-SSW039-19198",size:"872×534×430 см",specs:[],description:"Дві сірі сітчасті кулі-вежі, з’єднані прямим сітчастим переходом, із вигнутими канатними тунелями по боках і помаранчево-жовтою трубчастою гіркою. На верхівках — фігурка-зірка та пташки, біля входу — жовта фігура-равлик.",badge:null,catalogPage:78,catalogOrder:267,image:"/catalog/products/hd-ssw039-19198.webp"},{id:"hd-ssw040-19198",category:"kanatni-kompleksy",name:"Канатний тунель «Змійка» на двох арках",code:"HD-SSW040-19198",size:"800×250×400 см",specs:[],description:"Хвилястий канатний тунель, що двічі піднімається на помаранчевій і жовтій П-подібних арках. На кінцях — входи у вигляді помаранчевої фігурки звірятка та жовтого равлика, на жовтій арці — фігурка пташки.",badge:null,catalogPage:78,catalogOrder:268,image:"/catalog/products/hd-ssw040-19198.webp"},{id:"hd-ssw041-19198",category:"kanatni-kompleksy",name:"Канатний замок із двома вежами та салатовою гіркою",code:"HD-SSW041-19198",size:"680×450×410 см",specs:[],description:"Дві сітчасті вежі з червоними конусними дахами, з’єднані U-подібними канатними тунелями на сірих стійках. Салатова трубчаста гірка з прозорою секцією, вхід у вигляді зеленої фігурки-гусениці та пташки на стійках.",badge:null,catalogPage:78,catalogOrder:269,image:"/catalog/products/hd-ssw041-19198.webp"},{id:"hd-mtz024-20103",category:"dytiachi-sportyvni-kompleksy",name:"Дерев’яний канатний комплекс із сітками для балансування",code:"HD-MTZ024-20103",size:"450×220×140 см",specs:[],description:"Низький каркас із круглих дерев’яних колод на піщаному майданчику з натягнутими горизонтальними канатними сітками. Між стовпами протягнуто канати-поручні та канати для переходів і балансування; поруч показано вид згори.",badge:"Новинка",catalogPage:33,catalogOrder:183,image:"/catalog/products/hd-mtz024-20103.webp"},{id:"hd-mtz025-20103",category:"dytiachi-sportyvni-kompleksy",name:"Дерев’яний комплекс для лазіння з кільцями та дощатим містком",code:"HD-MTZ025-20103",size:"400×380×210 см",specs:[],description:"Конструкція з дерев’яних колод і дощок: дощатий місток із канатними бортами та червоними поручнями, гімнастичні кільця на червоній перекладині. Має похилі канатні сітки, вертикальну сітку-драбину, стінку з кольоровими зачепами та пеньки; поруч показано вид згори.",badge:"Новинка",catalogPage:33,catalogOrder:184,image:"/catalog/products/hd-mtz025-20103.webp"},{id:"hd-mtz026-20104",category:"dytiachi-sportyvni-kompleksy",name:"Дерев’яна смуга перешкод із шинами та скеледромом",code:"HD-MTZ026-20104",size:"1430×380×210 см",specs:[],description:"Довга лінійна траса з дерев’яних брусів із зеленими накладками: підвісні колоди-сходинки на ланцюгах, дві підвісні шини, вертикальна канатна сітка, стінка з кольоровими зачепами та рама з підвісними ручками. Далі — зелена перфорована стінка, рама з арками й горизонтальною сіткою, підвісний місток і пеньки-сходинки; поруч показано вид згори.",badge:"Новинка",catalogPage:34,catalogOrder:185,image:"/catalog/products/hd-mtz026-20104.webp"},{id:"hd-mtz027-20104",category:"dytiachi-sportyvni-kompleksy",name:"Дерев’яна смуга перешкод «Крокодил»",code:"HD-MTZ027-20104",size:"2450×340×320 см",specs:[],description:"Дуже довга дерев’яна траса, що починається з великої фігури-голови крокодила, з драбиною з колод і А-подібною вежею з брусів. Далі — місток із канатними поручнями, хвилясті дерев’яні панелі, переходи з перехрещених колод і червоні канатні сітки; поруч показано вид згори.",badge:"Новинка",catalogPage:34,catalogOrder:186,image:"/catalog/products/hd-mtz027-20104.webp"},{id:"hd-swn005-19201",category:"dytiachi-sportyvni-kompleksy",name:"Спортивний комплекс зі скеледромами та штучною скелею",code:"HD-SWN005-19201",size:"1225×680×260 см",specs:[],description:"Каркас із червоними скеледромними панелями, канатними сітками, штучною скелею, гойдалкою-балансиром і пеньками для переступання.",badge:null,catalogPage:79,catalogOrder:270,image:"/catalog/products/hd-swn005-19201.webp"},{id:"hd-swn006-19201",category:"dytiachi-sportyvni-kompleksy",name:"Спортивний комплекс із тунелем-гусеницею та червоним куполом",code:"HD-SWN006-19201",size:"1510×630×260 см",specs:[],description:"Чорний каркас із жовтими й сірими скеледромними панелями, канатною сіткою, кільцями-лазами та підвісними сходинками. Поруч — червоно-жовтий тунель-гусениця, червоний купол-скеледром, кільцева лава, обертове сидіння й пеньки для переступання.",badge:null,catalogPage:79,catalogOrder:271,image:"/catalog/products/hd-swn006-19201.webp"},{id:"hd-swn007-19202",category:"dytiachi-sportyvni-kompleksy",name:"Синьо-жовтий спортивний комплекс із хвилястими скеледромами",code:"HD-SWN007-19202",size:"1315×1305×260 см",specs:[],description:"Синій каркас із жовтими хвилястими скеледромами, рукоходами, червоною канатною сіткою та гойдалками-гніздами. Поруч — синій звивистий лаз, синьо-жовта кільцева лава, червона гойдалка-балансир на пружинах, сіра скеля з тунелем і пеньки для переступання.",badge:null,catalogPage:80,catalogOrder:272,image:"/catalog/products/hd-swn007-19202.webp"},{id:"hd-swn008-19202",category:"dytiachi-sportyvni-kompleksy",name:"Чорно-салатовий спортивний комплекс із хвилястою гіркою",code:"HD-SWN008-19202",size:"1595×525×260 см",specs:[],description:"Чорний каркас із салатовими й сірими скеледромними панелями, рукоходами, червоною канатною сіткою з підвісними сидіннями та кільцями-лазами. Поруч — салатова хвиляста гірка зі скелею-тунелем, сіро-салатова кільцева лава, обертове сидіння й пеньки для переступання.",badge:null,catalogPage:80,catalogOrder:273,image:"/catalog/products/hd-swn008-19202.webp"},{id:"hd-swn009-19203",category:"dytiachi-sportyvni-kompleksy",name:"Спортивний комплекс з арками та канатним тунелем",code:"HD-SWN009-19203",size:"1700×1050×270 см",specs:[],description:"Аркові конструкції об’єднують довгий канатний тунель, скеледроми, купол-лазалку, гімнастичні кільця, рукохід і гірку.",badge:null,catalogPage:81,catalogOrder:274,image:"/catalog/products/hd-swn009-19203.webp"},{id:"hd-swn010-19204",category:"dytiachi-sportyvni-kompleksy",name:"Спортивний комплекс із сітчастим кубом під арками та гойдалками",code:"HD-SWN010-19204",size:"1485×1035×260 см",specs:[],description:"Сірі арки над червоною канатною сіткою-кубом із синьо-помаранчевими кільцями-лазами всередині, підвісними сходинками-горщиками та рукоходом. Довкола — сині, помаранчеві й жовті скеледроми, гойдалки, кільця-гнізда, синя гірка, колоди-балансири та сіра скеля з тунелем.",badge:null,catalogPage:82,catalogOrder:275,image:"/catalog/products/hd-swn010-19204.webp"},{id:"hd-swn015-19209",category:"dytiachi-sportyvni-kompleksy",name:"Спортивний комплекс із червоними кільцями-лазами під сірими арками",code:"HD-SWN015-192 з зеленим двосхилим дахом і гіркою",code:"HD-TBC012-19292",size:"900×460×320 см",specs:[],description:"Довгий павільйон під зеленим двосхилим дахом із сітчастими стінами, кількома батутами всередині та баскетбольними щитами. Має червоний вхід зі сходами, червону гірку збоку та кольорові панно по низу.",badge:null,catalogPage:102,catalogOrder:411,image:"/catalog/products/hd-tbc012-19292.webp"},{id:"hd-tbc013-19292",category:"batuty",name:"Батутний павільйон на подіумі з двома гірками",code:"HD-TBC013-19292",size:"620×570×320 см",specs:[],description:"Піднятий на подіум батут у синьому решітчастому каркасі із сіткою під зеленим двосхилим дахом. З двох боків розташовано сині сходи та червоні хвилясті гірки, а подіум прикрашено панно з мультяшними тваринками.",badge:null,catalogPage:102,catalogOrder:412,image:"/catalog/products/hd-tbc013-19292.webp"},{id:"hd-tbc010-19292",category:"batuty",name:"Батут-шатро зі смугастим жовто-помаранчевим дахом",code:"HD-TBC010-19292",size:"320×320×320 см",specs:[],description:"Квадратний батут у салатовому каркасі із сітчастими стінками під жовто-помаранчевим смугастим шатром. Біля входу — жовті сходинки з поручнями.",badge:null,catalogPage:102,catalogOrder:413,image:"/catalog/products/hd-tbc010-19292.webp"},{id:"hd-tbc015-19292",category:"batuty",name:"Батутний павільйон «Морський» із русалками",code:"HD-TBC015-19292",size:"600×560×340 см",specs:[],description:"Синій каркас із сітчастими стінками під жовто-блакитним смугастим дахом із фігурним краєм. Усередині — батути з червоною окантовкою, на вході — панно з русалками й підводним світом та жовті сходинки.",badge:null,catalogPage:102,catalogOrder:414,image:"/catalog/products/hd-tbc015-19292.webp"},{id:"hd-sbc026-19339",category:"batuty",name:"Батутний парк у рожево-салатовій гамі з ніндзя-трасою",code:"HD-SBC026-19339",size:"1840×1730×350 см",specs:[],description:"Критий батутний центр із рожевою та салатовою батутними зонами, двома поролоновими ямами з рожевими кубиками, ферменною ніндзя-трасою, скеледромом і двома білими матами. Огороджений чорною сіткою, із салатовими сходами на вході; поруч — схема планування.",badge:null,catalogPage:103,catalogOrder:415,image:"/catalog/products/hd-sbc026-19339.webp"},{id:"hd-sbc033-19339",category:"batuty",name:"Батутний зал у жовто-блакитній гамі з похилими батутами",code:"HD-SBC033-19339",size:"1580×1240×350 см",specs:[],description:"Прямокутний батутний зал із жовтими, блакитними, бузковими й сірими доріжками між батутами та похилими батутами вздовж стін. Має два баскетбольні щити, дерев’яну стінку для лазіння, білий мат і блакитні сходи; огороджений чорною сіткою.",badge:null,catalogPage:103,catalogOrder:416,image:"/catalog/products/hd-sbc033-19339.webp"},{id:"hd-sbc028-19339",category:"batuty",name:"Великий батутний парк у зеленій гамі",code:"HD-SBC028-19339",size:"2450×1570×350 см",specs:[],description:"Зелений батутний майданчик із десятками прямокутних батутів, похилими батутами з помаранчевою окантовкою, дерев’яними стінками-перешкодами та білим матом посередині. По периметру — сітчаста огорожа, поруч — схема планування.",badge:null,catalogPage:103,catalogOrder:417,image:"/catalog/products/hd-sbc028-19339.webp"},{id:"hd-sbc029-19339",category:"batuty",name:"Батутний парк із ніндзя-трасою над поролоновою ямою",code:"HD-SBC029-19339",size:"1520×1800×460 см",specs:[],description:"Червона батутна зона з прямокутними батутами та сходами поруч із великою поролоновою ямою, над якою зведено ферменну ніндзя-трасу з жовто-чорними стійками. Периметр огороджено сіткою, по низу — панно з будиночками; є схема планування.",badge:null,catalogPage:103,catalogOrder:418,image:"/catalog/products/hd-sbc029-19339.webp"},{id:"hd-sbc030-19340",category:"batuty",name:"Батутна зона з двома секціями та стінкою-мішенню",code:"HD-SBC030-19340",size:"930×630×350 см",specs:[],description:"Дві сітчасті секції — жовта й сіра — з прямокутними батутами; у сірій секції синя «космічна» стінка з кульками-зачепами. Входи — жовті та сірі сходи, по низу панно з пляжем і планетами.",badge:null,catalogPage:104,catalogOrder:419,image:"/catalog/products/hd-sbc030-19340.webp"},{id:"hd-sbc031-19340",category:"batuty",name:"Батутна зона з чотирма шестикутними батутами",code:"HD-SBC031-19340",size:"810×700×320 см",specs:[],description:"Чотири шестикутні батути в помаранчевій рамі, огороджені блакитним каркасом із сіткою. Вхід — жовті м’які сходи, по низу — панно з жабенятами та веселкою.",badge:null,catalogPage:104,catalogOrder:420,image:"/catalog/products/hd-sbc031-19340.webp"},{id:"hd-sbc032-19340",category:"batuty",name:"Батутна арена з трьома батутами в кольорових рамках",code:"HD-SBC032-19340",size:"1200×1100×250 см",specs:[],description:"Велика чорна арена, огороджена синім каркасом із сіткою, з трьома батутами в червоній, жовтій (піднятій) і блакитній рамках. Вхід — жовті сходи; поруч — схема планування.",badge:null,catalogPage:104,catalogOrder:421,image:"/catalog/products/hd-sbc032-19340.webp"},{id:"hd-sbc007-19340",category:"batuty",name:"Квадратний батут у жовтому сітчастому каркасі",code:"HD-SBC007-19340",size:"246×310×260 см",specs:[],description:"Квадратний батут із червоною окантовкою в жовтому трубчастому каркасі, обтягнутому сіткою. Вхід — жовті м’які сходинки.",badge:null,catalogPage:104,catalogOrder:422,image:"/catalog/products/hd-sbc007-19340.webp"},{id:"hd-sbc021-19333",category:"batuty",name:"Великий батутний парк з ігровим комплексом і веселковою гіркою",code:"HD-SBC021-19333",size:"6900×3500×840 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Великий критий парк на салатовій підлозі: фіолетові батутні арени, жовте поле батутів, шестикутні батути, поролонові ями з блакитними кубиками, ніндзя-траса та скеледром із трубчастою гіркою. Є багаторівневий ігровий комплекс із баштами, широка веселкова хвиляста гірка та зона з білими столиками.",badge:null,catalogPage:105,catalogOrder:423,image:"/catalog/products/hd-sbc021-19333.webp"},{id:"hd-sbc022-19334",category:"batuty",name:"Критий батутний парк",code:"HD-SBC022-19334",size:"7250×3120×840 см",specs:["Місткість: 25–60 осіб","Вік: 3–12 років"],description:"Критий парк із рядами батутів, поролоновими ямами, ніндзя-трасою, скеледромом і баскетбольними доріжками. У каталозі є схема планування та фото реального залу.",badge:null,catalogPage:106,catalogOrder:424,image:"/catalog/products/hd-sbc022-19334.webp"},{id:"hd-trt041-19313",category:"miaki-moduli",name:"М’який ігровий комплекс «Морквина» із сухим басейном",code:"HD-TRT041-19313",size:"450×450×280 см",specs:[],description:"Будиночок у формі морквини: помаранчевий «верх» із зеленим листям, жовтий корпус у помаранчеві цятки з арковими входами. Навколо — сухий басейн із білими кульками, салатові гірки, помаранчеві сходинки та салатовий тунель-арка.",badge:null,catalogPage:107,catalogOrder:425,image:"/catalog/products/hd-trt041-19313.webp"},{id:"hd-qjm024-20290",category:"miaki-moduli",name:"Набір м’яких будівельних блоків пастельних кольорів (58 елементів)",code:"HD-QJM024-20290",size:"",specs:["Кількість елементів: 58 шт."],description:"Набір м’яких блоків пастельних кольорів: куби, трикутники, арки, циліндри й півкола, з яких діти будують вежі. Показано на фото з двома малюками.",badge:null,catalogPage:107,catalogOrder:426,image:"/catalog/products/hd-qjm024-20290.webp"},{id:"hd-qjm028-20290",category:"miaki-moduli",name:"Набір яскравих м’яких блоків «Замок» (58 елементів)",code:"HD-QJM028-20290",size:"",specs:["Кількість елементів: 58 шт."],description:"Набір яскравих м’яких блоків — червоних, жовтих, фіолетових і зелених — із трикутниками, арками, кільцями та брусками, складений у форму замку з вежами. Поруч намальовано дітей для масштабу.",badge:null,catalogPage:107,catalogOrder:427,image:"/catalog/products/hd-qjm028-20290.webp"},{id:"hd-trt042-19314",category:"miaki-moduli",name:"М’який замок із сухим басейном",code:"HD-TRT042-19314",size:"600×420×260 см",specs:[],description:"Дві вежі з куполами, сітчастий тунель-місток між ними, гірка та сухий басейн із кульками.",badge:null,catalogPage:108,catalogOrder:428,image:"/catalog/products/hd-trt042-19314.webp"},{id:"hd-trt001-19314",category:"miaki-moduli",name:"М’який ігровий комплекс «Чарівний ліс» із веселковим містком",code:"HD-TRT001-19314",size:"1050×460×300 см",specs:[],description:"Великий комплекс із двома смугастими вежами-деревами з круглими кронами в кольорові цятки, веселковим канатним містком під вивіскою «WELCOME» над сухим басейном і підвісними м’якими грушами. Навколо — веселкові мати, грибочки, арки та круглі сходинки-«цукерки».",badge:null,catalogPage:108,catalogOrder:429,image:"/catalog/products/hd-trt001-19314.webp"},{id:"hd-trt043-19314",category:"miaki-moduli",name:"М’яка ігрова зона з альтанкою та фруктами",code:"HD-TRT043-19314",size:"450×400×230 см",specs:[],description:"Салатовий м’який майданчик у помаранчевому бортику з альтанкою під зеленим дахом (із сітчастими стінками та кульками всередині), сходинками, трикутною стінкою з зачепами та гіркою. На підлозі — м’які фігури вишні, банана, гусениці та кубики з малюнками.",badge:null,catalogPage:108,catalogOrder:430,image:"/catalog/products/hd-trt043-19314.webp"},{id:"hd-trt044-19314",category:"miaki-moduli",name:"М’який навчальний комплекс «Будиночок» з літерами й цифрами",code:"HD-TRT044-19314",size:"450×190×155 см",specs:[],description:"Червоний м’який будиночок із «засніженим» дахом і арковими проходами, салатовий пандус із літерами «C B A» та жовті сходинки з цифрами «3 2 1». Навколо — валики, блакитна доріжка та червоно-помаранчевий бортик зі стовпчиками-«сніжками».",badge:null,catalogPage:108,catalogOrder:431,image:"/catalog/products/hd-trt044-19314.webp"},{id:"hd-trt045-19315",category:"miaki-moduli",name:"М’який модуль «Робот» із гірками",code:"HD-TRT045-19315",size:"360×260×220 см",specs:[],description:"М’яка фігура робота з проходом-аркою, двома похилими гірками та декоративними колесами.",badge:null,catalogPage:109,catalogOrder:432,image:"/catalog/products/hd-trt045-19315.webp"},{id:"hd-trt046-19315",category:"miaki-moduli",name:"М’який модуль «Комбайн»",code:"HD-TRT046-19315",size:"400×220×200 см",specs:[],description:"Помаранчевий м’який комбайн із білою кабіною, віконцями та червоним маячком на даху, великими чорними колесами й блакитними смугами. Спереду — три блакитні похилі елементи-«жатки» з чорними наконечниками.",badge:null,catalogPage:109,catalogOrder:433,image:"/catalog/products/hd-trt046-19315.webp"},{id:"hd-trt047-19315",category:"miaki-moduli",name:"М’яка гірка «Жирафа»",code:"HD-TRT047-19315",size:"350×260×180 см",specs:[],description:"Жовта м’яка жирафа з коричневими плямами: шия з головою утворює гірку, а збоку розташовано сходинки з коричневими бортиками та дві арки-проходи.",badge:null,catalogPage:109,catalogOrder:434,image:"/catalog/products/hd-trt047-19315.webp"},{id:"hd-trt048-19315",category:"miaki-moduli",name:"Сухий басейн «Гарбуз» із м’якими фруктами",code:"HD-TRT048-19315",size:"250×45 см",specs:[],description:"Круглий сухий басейн із білими кульками в оточенні помаранчевого сегментованого «гарбуза» та салатових сходинок на зеленому мате у формі листка. Поруч — м’які скибки кавуна, полуниці та помаранчеві напівсфери.",badge:null,catalogPage:109,catalogOrder:435,image:"/catalog/products/hd-trt048-19315.webp"},{id:"hd-trt049-19316",category:"miaki-moduli",name:"Прямокутний сухий басейн із м’яким парканчиком",code:"HD-TRT049-19316",size:"700×300×70 см",specs:[],description:"Довгий прямокутний сухий басейн із білими кульками, огороджений м’якими штахетами в блакитних і синіх тонах на блакитній основі.",badge:null,catalogPage:110,catalogOrder:436,image:"/catalog/products/hd-trt049-19316.webp"},{id:"hd-trt013-19316",category:"miaki-moduli",name:"Ігровий модуль «Паровозик» із сітчастим вагоном і гіркою",code:"HD-TRT013-19316",size:"500×150×180 см",specs:[],description:"Червоний паровозик із блакитним котлом і жовтим димарем, колесами з бірюзовими дисками та фіолетовим сітчастим вагоном. До вагона ведуть сходинки, а з нього спускається жовта гірка.",badge:null,catalogPage:110,catalogOrder:437,image:"/catalog/products/hd-trt013-19316.webp"},{id:"hd-trt050-19316",category:"miaki-moduli",name:"М’який модуль «Вантажівка» з маячком",code:"HD-TRT050-19316",size:"210×130×130 см",specs:[],description:"Червона м’яка вантажівка з біло-блакитними вікнами, сріблястою решіткою радіатора та маячком на даху, синім кузовом із червоно-білими смугами та великими чорними колесами.",badge:null,catalogPage:110,catalogOrder:438,image:"/catalog/products/hd-trt050-19316.webp"},{id:"hd-trt011-19316",category:"miaki-moduli",name:"Набір низьких м’яких модулів пастельних кольорів",code:"HD-TRT011-19316",size:"270×210×60 см",specs:[],description:"Невисокий набір м’яких модулів у пастельних салатових, бузкових, жовтих і білих тонах: сходинки, пандуси з цятками, півкруглі елементи та напівциліндр.",badge:null,catalogPage:110,catalogOrder:439,image:"/catalog/products/hd-trt011-19316.webp"},{id:"hd-trt030-19316",category:"miaki-moduli",name:"М’який будиночок-вежа з деревом і двома гірками",code:"HD-TRT030-19316",size:"300×100×180 см",specs:[],description:"Червоний будиночок-вежа з веселкою над аркою, віконцем-решіткою та аплікацією зеленого дерева з плодами. З двох боків — гірка й пандус, прикрашені жовтими квіточками.",badge:null,catalogPage:110,catalogOrder:440,image:"/catalog/products/hd-trt030-19316.webp"},{id:"hd-trt051-19316",category:"miaki-moduli",name:"М’яка смуга перешкод «Моржі» з валиками",code:"HD-TRT051-19316",size:"550×160×170 см",specs:[],description:"Дві жовті хвилясті гірки-сходинки з головами мультяшних персонажів із іклами й вусами (схожих на моржів) у червоно-коричневих «коронах», з’єднані помаранчевим містком із валиків.",badge:null,catalogPage:110,catalogOrder:441,image:"/catalog/products/hd-trt051-19316.webp"},{id:"hd-trt052-19316",category:"miaki-moduli",name:"М’який модуль «Ракета» з двома гірками",code:"HD-TRT052-19316",size:"230×150×210 см",specs:[],description:"Червона ракета з жовтим носом, круглим ілюмінатором і аркою-входом на синій основі-«хмарі»; з двох боків — жовті гірки.",badge:null,catalogPage:110,catalogOrder:442,image:"/catalog/products/hd-trt052-19316.webp"},{id:"hd-ttb052-19329",category:"labirynty",name:"Ігровий лабіринт «Панда»",code:"HD-TTB052-19329",size:"900×625×390 см",specs:["Місткість: 25–60 осіб","Вік: 3–12 років"],description:"Дворівневий зелено-чорний лабіринт із пандами, веселковою аркою над входом і гірками.",badge:null,catalogPage:111,catalogOrder:443,image:"/catalog/products/hd-ttb052-19329.webp"},{id:"hd-ttb053-19330",category:"labirynty",name:"Лабіринт «Пожежна машина»",code:"HD-TTB053-19330",size:"470×470×280 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Дворівневий червоний каркас у формі пожежної машини з кабіною, колесами та панно з пожежними емблемами й фігурою пожежника. Збоку — широка жовто-блакитна гірка, всередині — сходинки.",badge:null,catalogPage:112,catalogOrder:444,image:"/catalog/products/hd-ttb053-19330.webp"},{id:"hd-ttb054-19330",category:"labirynty",name:"Сітчастий лабіринт із батутом і сухим басейном",code:"HD-TTB054-19330",size:"625×505×280 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Білий трубчастий каркас із сітками на синій підлозі з кількома відсіками: сухий басейн із синьо-білими кульками, батут, гірка та червоні сходинки з британським прапором.",badge:null,catalogPage:112,catalogOrder:445,image:"/catalog/products/hd-ttb054-19330.webp"},{id:"hd-ttb055-19330",category:"labirynty",name:"Лабіринт «Цирк» зі смугастими дахами",code:"HD-TTB055-19330",size:"460×320×370 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Червоно-фіолетовий дворівневий каркас із двома вежами під червоно-білими смугастими шатровими дахами, панно з клоуном, підвісними м’якими грушами та червоними сходинками.",badge:null,catalogPage:112,catalogOrder:446,image:"/catalog/products/hd-ttb055-19330.webp"},{id:"hd-ttb056-19330",category:"labirynty",name:"Лабіринт-замок у британському стилі",code:"HD-TTB056-19330",size:"505×460×370 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Червоно-синій замок із чорними шпилями, вікнами-панно та сітчастими рівнями. Збоку — широка гірка й червоні сходинки з малюнком британського прапора.",badge:null,catalogPage:112,catalogOrder:447,image:"/catalog/products/hd-ttb056-19330.webp"},{id:"hd-ttb057-19331",category:"labirynty",name:"Ігровий центр «Крижаний замок»",code:"HD-TTB057-19331",size:"1820×1270×420 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Біло-блакитне «зимове» містечко з вежами під червоними прапорцями, трубчастою та широкою гірками з китами, сухим басейном і каруселлю-ракетою. Також є жовтий грибок, маленька гірка, стіл-пісочниця, верхній ярус із гарматами для кульок і овальна гірка-трек; підлога в шахову клітинку.",badge:null,catalogPage:113,catalogOrder:448,image:"/catalog/products/hd-ttb057-19331.webp"},{id:"hd-ttb058-19332",category:"labirynty",name:"Лабіринт «Паровозик» із трьома вагонами",code:"HD-TTB058-19332",size:"1200×255×320 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Червоний потяг із чорно-жовтим паровозом і трьома вагонами-будиночками з віконцями. Нижній ярус обтягнутий сіткою, всередині — м’які перешкоди й груші, позаду — червона гірка.",badge:null,catalogPage:114,catalogOrder:449,image:"/catalog/products/hd-ttb058-19332.webp"},{id:"hd-ttb059-19332",category:"labirynty",name:"Лабіринт «Місто професій»",code:"HD-TTB059-19332",size:"900×440×360 см",specs:["Місткість: 10–25 осіб","Вік: 3–12 років"],description:"Лабіринт для рольових ігор із поліцейською дільницею, лікарнею та пожежною частиною з гіркою.",badge:null,catalogPage:114,catalogOrder:450,image:"/catalog/products/hd-ttb059-19332.webp"},{id:"hd-ttb015-19322",category:"labirynty",name:"Лабіринт «Тропіки» з пальмами",code:"HD-TTB015-19322",size:"625×505×280 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Синій сітчастий каркас із пальмами на верхівках і панно з тваринами (коала, птах). Усередині — кілька рівнів, сухий басейн із різнокольоровими кульками та гірка, біля входу — м’які сходинки.",badge:null,catalogPage:114,catalogOrder:451,image:"/catalog/products/hd-ttb015-19322.webp"},{id:"hd-ttb060-19332",category:"labirynty",name:"Лабіринт «Джунглі» з крокодилом",code:"HD-TTB060-19332",size:"900×505×350 см",specs:["Вік: 3–12 років","Місткість: 10–25 осіб"],description:"Зелений лабіринт у стилі джунглів із солом’яною хатинкою, великою фігурою крокодила, вітряком і пальмами. Поруч — сухий басейн із жовтими кульками та похилий пандус.",badge:null,catalogPage:114,catalogOrder:452,image:"/catalog/products/hd-ttb060-19332.webp"},{id:"hd-ttb041-19319",category:"labirynty",name:"Ігровий центр «Зелений ліс» з автотреком",code:"HD-TTB041-19319",size:"2700×2250×560 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Великий Г-подібний ігровий центр за цегляною огорожею: «море» блакитних кульок під деревами, будиночки з гірками, червоний літак, канатна сфера-лазалка та зона з шестикутними батутами. Окремо — автотрек із розміткою та машинками.",badge:null,catalogPage:115,catalogOrder:453,image:"/catalog/products/hd-ttb041-19319.webp"},{id:"hd-ttb042-19320",category:"labirynty",name:"Ігровий центр «Казковий замок»",code:"HD-TTB042-19320",size:"1780×1780×600 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Фіолетово-синій замок із мурами, вежами під помаранчевими дахами й факелами-вогнями. Усередині — велике «море» салатових кульок із деревами, широкі хвилясті й трубчаста гірки, сходи та балкони.",badge:null,catalogPage:116,catalogOrder:454,image:"/catalog/products/hd-ttb042-19320.webp"},{id:"hd-ttb043-19321",category:"labirynty",name:"Ігрове містечко з дорогами та будівлями",code:"HD-TTB043-19321",size:"2600×2750×450 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Дитяче місто за блакитною огорожею: рожева лікарня, синя поліцейська дільниця, червона цегляна будівля, дороги з пішохідними переходами, круговим рухом і паркуванням «P», машинки для катання та вертоліт. Вхід — арка-веселка з колесами, з тунелями під червоними навісами.",badge:null,catalogPage:117,catalogOrder:455,image:"/catalog/products/hd-ttb043-19321.webp"},{id:"hd-ttb044-19322",category:"labirynty",name:"Ігрова кімната «Авіатор» із сухим басейном",code:"HD-TTB044-19322",size:"1480×940×380 см",specs:[],description:"Помаранчево-біла ігрова кімната з великим басейном білих кульок, фонтаном кульок у центрі, спіральною та широкою гірками, сходами й сіткою для лазіння. Над конструкцією — червоний біплан і декоративні пропелери.",badge:null,catalogPage:118,catalogOrder:456,image:"/catalog/products/hd-ttb044-19322.webp"},{id:"hd-ttb045-19322",category:"labirynty",name:"Дворівневий рожево-бірюзовий лабіринт із гіркою",code:"HD-TTB045-19322",size:"1100×430×360 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Двоярусний рожево-бірюзовий ігровий комплекс із вікнами-зірками, великим декоративним вентилятором у шестикутнику, м’якими сходинками, сходами та гіркою на тлі стіни з хмарами.",badge:null,catalogPage:118,catalogOrder:457,image:"/catalog/products/hd-ttb045-19322.webp"},{id:"hd-ttb046-19323",category:"labirynty",name:"Великий сімейний розважальний центр зі скеледромом і автотреком",code:"HD-TTB046-19323",size:"3300×4600×800 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Величезний критий центр: багаторівневий лабіринт у фермерському стилі з трубчастими гірками, вежа-скеля, скеледромні стіни, батути, басейн із жовтими кульками та червона гірка. У центрі — автотрек із машинками, поруч — зона ігрових автоматів.",badge:null,catalogPage:119,catalogOrder:458,image:"/catalog/products/hd-ttb046-19323.webp"},{id:"hd-ttb047-19324",category:"labirynty",name:"Ігровий центр «Лісова казка» з вежами-полуницями",code:"HD-TTB047-19324",size:"3230×1600×650 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Зелений лісовий ігровий центр із вежами у вигляді полуниць, широкою жовтою гіркою, прозорими трубчастими гірками, багаторівневим лабіринтом і басейном із кульками. Є окрема зона для малюків із м’якими модулями та батути, а огорожу прикрашають панно з драконом.",badge:null,catalogPage:120,catalogOrder:459,image:"/catalog/products/hd-ttb047-19324.webp"},{id:"hd-ttb048-19325",category:"labirynty",name:"Ігровий центр «Королівський цирк» із годинниковими вежами",code:"HD-TTB048-19325",size:"4000×2600×840 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Червоно-біло-фіолетовий ігровий центр зі смугастими стінами в зірках, вежами з годинниками та білими шпилями, червоними будками «TELEPHONE» і шатром-каруселлю. Є багаторівневий лабіринт, смугасті хвилясті гірки, сітчасті вежі, зона батутів під фермою з поролоновою ямою та кафе-зона зі столиками.",badge:null,catalogPage:121,catalogOrder:460,image:"/catalog/products/hd-ttb048-19325.webp"},{id:"hd-ttb049-19326",category:"labirynty",name:"Багаторівневий лабіринт із куполами та трубчастими гірками",code:"HD-TTB049-19326",size:"1745×1350×690 см",specs:["Вік: 3–12 років","Місткість: 25–60 осіб"],description:"Багатоярусний сітчастий лабіринт на червоно-синьому каркасі з вежами під жовтими й червоним ажурними куполами. Синя, помаранчева та фіолетова спіральна трубчасті гірки, широкі хвилясті гірки, басейн із жовтими кульками та переходи-тунелі з ілюмінаторами.",badge:null,catalogPage:122,catalogOrder:461,image:"/catalog/products/hd-ttb049-19326.webp"},{id:"hd-qdd001-19309",category:"pokryttia",name:"Модульна пластикова плитка із замками",code:"HD-QDD001-19309",size:"",specs:["Кольори: 8001, 8002, 8003, 8004, 8005, 8006, 8007, 8008"],description:"Перфорована квадратна плитка з петлями-замками по краях і з’єднувальні бортики. Подано вісім кольорів: червоний, жовто-помаранчевий, зелений, синій, темно-бірюзовий, темно-фіолетовий, помаранчевий і сірий; на фото — критий і відкриті майданчики, викладені плиткою з візеру
